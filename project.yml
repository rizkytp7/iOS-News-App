name: CodeNewsIOS

# ---------------------------------------------------------------------------
# Global options
# ---------------------------------------------------------------------------
options:
  bundleIdPrefix: com.codenews
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Xcode 16 / Swift 6 — keep the default xcodeVersion auto-detected
  xcodeVersion: "16.0"

# ---------------------------------------------------------------------------
# Config files  (Debug → Dev xcconfig, Release → Prod xcconfig)
# Both inherit from Secrets.xcconfig which holds the API key.
# ---------------------------------------------------------------------------
configFiles:
  Debug:   Configs/Dev.xcconfig
  Release: Configs/Prod.xcconfig

# ---------------------------------------------------------------------------
# Project-wide build settings (apply to all targets)
# ---------------------------------------------------------------------------
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Strict concurrency only for the app target — set per-target below
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES

# ---------------------------------------------------------------------------
# Targets
# ---------------------------------------------------------------------------
targets:

  # ── Main application ────────────────────────────────────────────────────
  CodeNewsIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # Source folders — xcodegen picks up all .swift files recursively
    sources:
      - path: App
      - path: Core
      - path: Data
      - path: Domain
      - path: Modules

    # Info.plist is generated by xcodegen at the project root level;
    # INFOPLIST_FILE must match that generated path.
    info:
      path: Info.plist          # xcodegen writes this next to .xcodeproj
      properties:
        CFBundleName:                "$(APP_DISPLAY_NAME)"
        CFBundleDisplayName:         "$(APP_DISPLAY_NAME)"
        CFBundleIdentifier:          "$(PRODUCT_BUNDLE_IDENTIFIER)"
        CFBundleVersion:             "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString:  "$(MARKETING_VERSION)"
        CFBundleExecutable:          "$(EXECUTABLE_NAME)"
        CFBundlePackageType:         APPL
        LSRequiresIPhoneOS:          true
        UILaunchScreen:              {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # API key injected via xcconfig → build setting → Info.plist
        NEWS_API_KEY:                "$(NEWS_API_KEY)"
        # Allow HTTP only for NewsAPI images (some are HTTP)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            newsapi.org:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER:    "$(APP_BUNDLE_ID)"
        INFOPLIST_FILE:               Info.plist
        SWIFT_STRICT_CONCURRENCY:     complete
        # Swift 6 language mode
        SWIFT_VERSION:                "6.0"
        # Code signing — developer will set their own team
        CODE_SIGN_STYLE:              Automatic
        DEVELOPMENT_TEAM:             ""
        # Debug/Release-specific overrides come from xcconfig files
      configs:
        Debug:
          xcconfig: Configs/Dev.xcconfig
        Release:
          xcconfig: Configs/Prod.xcconfig

  # ── Unit tests ──────────────────────────────────────────────────────────
  CodeNewsIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: CodeNewsIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codenews.CodeNewsIOSTests
        SWIFT_VERSION:             "6.0"
        INFOPLIST_FILE:            ""

# ---------------------------------------------------------------------------
# Schemes
# ---------------------------------------------------------------------------
schemes:
  CodeNewsIOS:
    build:
      targets:
        CodeNewsIOS: all
    run:
      config: Debug
      environmentVariables:
        - variable: APP_ENV
          value: development
          isEnabled: true
    test:
      config: Debug
      targets:
        - CodeNewsIOSTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
